services:

  # ============================================================
  # PostgreSQL - Main Banking Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexusbank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusbank}
      POSTGRES_USER: ${POSTGRES_USER:-nexusbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusbank_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nexusbank} -d ${POSTGRES_DB:-nexusbank}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - nexusbank-network


  # ============================================================
  # Redis - Cache / Session / Rate Limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: nexusbank-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - nexusbank-network


  # ============================================================
  # Kafka - Banking Event / Messaging System
  # KRaft mode: No Zookeeper required
  # ============================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: nexusbank-kafka
    restart: unless-stopped

    environment:

      # ----------------------------
      # KRaft Configuration
      # ----------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # ----------------------------
      # Kafka Listeners
      # ----------------------------
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ----------------------------
      # Single-node Development Setup
      # ----------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      # ----------------------------
      # Log Configuration
      # ----------------------------
      KAFKA_LOG_RETENTION_HOURS: 168

      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - nexusbank-network


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  postgres_data:
    name: nexusbank-postgres-data

  redis_data:
    name: nexusbank-redis-data

  kafka_data:
    name: nexusbank-kafka-data


# ==============================================================
# Network
# ==============================================================

networks:

  nexusbank-network:
    name: nexusbank-network
    driver: bridge
